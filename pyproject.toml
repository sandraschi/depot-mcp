[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[project]
name = "schip-mcp-depot"
version = "0.1.0"
description = "Centralized fleet file depot â€” tiered NVMe/spinner storage with LanceDB vector search and SQLite FTS5 sidecar"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Sandra Schipal", email = "sandraschipal@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Archiving",
    "Topic :: System :: Filesystems",
    "Typing :: Typed",
]
keywords = ["depot", "file-storage", "mcp", "fastmcp", "lancedb", "fts5", "tiered-storage", "fleet"]

dependencies = [
    "fastmcp>=3.4.4,<4",
    "fastapi>=0.104.0,<1.0.0",
    "uvicorn[standard]>=0.24.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "aiohttp>=3.9.0,<4.0.0",
    "aiofiles>=23.1.0,<25.0.0",
    "python-multipart>=0.0.6,<1.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "lancedb>=0.15.0",
    "fastembed>=0.4.0",
    "httpx>=0.23.0,<1.0.0",
    "psutil>=5.9.0,<7.0.0",
    "tenacity>=8.0.0,<10.0.0",
    "watchfiles>=0.21.0",
    "prefab-ui>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "ruff>=0.16.0,<0.17",
    "mypy>=1.8.0",
    "bandit>=1.7.0",
    "safety>=3.0.0",
    "pre-commit>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "ruff>=0.16.0,<0.17",
    "mypy>=1.8.0",
    "bandit>=1.7.0",
    "safety>=3.0.0",
    "pre-commit>=3.0.0",
]

[project.scripts]
depot-mcp = "depot_mcp.__main__:main"

[project.entry-points."fastmcp.plugins"]
depot = "depot_mcp.plugin:register_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/depot_mcp"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".venv",
    "native",
    "web_sota/frontend/node_modules",
    "scripts/cua-smoke.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["S104", "S310", "S311", "S314", "S608", "S108", "S603", "S301", "S103", "S105", "S607", "S701", "S102", "S307", "S324", "ASYNC230", "B008", "B904", "B025", "B019", "B023", "C901", "UP035", "RUF006", "N806", "E501", "F841", "PLW1510", "BLE001", "RUF022", "E402", "F811", "B006", "B007", "RUF059", "RUF001", "RUF002", "RUF012", "DTZ005", "DTZ006", "DTZ001", "E741", "SIM115", "SIM102", "RUF100", "F401", "D103", "D101", "F821", "TRY002", "E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T20"]
"tests/**" = ["T20"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--cov=depot_mcp", "--cov-report=term-missing", "--cov-fail-under=40"]

[tool.coverage.run]
omit = ["*/tests/*", "*/test_*"]

[tool.uv-dynamic-versioning]
vcs = "git"
